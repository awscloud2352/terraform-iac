version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1

phases:
  install:
    commands:
      - echo "Installing Terraform on fleet instance..."
      - curl -o terraform.zip https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
      - unzip terraform.zip
      - sudo mv terraform /usr/local/bin/
      - terraform -version

  pre_build:
    commands:
      - echo "Initializing Terraform with remote state..."
      - terraform init -backend-config="bucket=my-terraform-state" -backend-config="dynamodb_table=my-terraform-lock"

  build:
    commands:
      - echo "Running Terraform plan..."
      - terraform plan -out=tfplan

  post_build:
    commands:
      - echo "Applying Terraform plan..."
      - terraform apply -auto-approve tfplan

artifacts:
  files:
    - '**/*'

